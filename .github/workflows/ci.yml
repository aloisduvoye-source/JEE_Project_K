# CI du projet : à chaque push sur main et à chaque Pull Request, compile les deux versions
# (jee-app et spring-app) avec chacune des deux interfaces (frontend et frontend-epure),
# puis lance chaque combinaison avec MySQL dans Docker et vérifie qu'elle répond.
# Java 17, comme le Tomcat du projet (tomcat:11.0-jdk17).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Un échec sur une combinaison n'arrête pas le test des autres
      fail-fast: false
      matrix:
        app: [jee-app, spring-app]
        front: [frontend, frontend-epure]
    name: ${{ matrix.app }} + ${{ matrix.front }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Dépendances Maven gardées d'un run à l'autre (renouvelées quand un pom.xml change) :
          # sans cache, les 4 jobs téléchargent tout en même temps et Maven Central répond 429 Too Many Requests
          cache: maven
          cache-dependency-path: '*/pom.xml'

      - name: Compiler (mvn clean package)
        run: mvn -f ${{ matrix.app }}/pom.xml clean package -Dfront=${{ matrix.front }}

      - name: Fichier .env factice
        run: printf 'DB_USER=ci\nDB_PASSWORD=ci\nAI_API_KEY=\n' > .env

      - name: Lancer MySQL + Tomcat
        run: APP=${{ matrix.app }} docker compose up -d --build --wait

      - name: L'application démarre et répond
        run: curl -fsS --retry 20 --retry-delay 3 --retry-all-errors http://localhost:8080/connexion > /dev/null

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs

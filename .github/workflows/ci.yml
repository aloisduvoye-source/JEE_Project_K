# CI du projet : compile l'application à chaque push sur main et à chaque Pull Request.
# Java 17, comme le Tomcat du projet (tomcat:10.1-jdk17).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler (mvn clean package)
        run: mvn -f jee-app/pom.xml clean package

      - name: Fichier .env factice
        run: printf 'DB_USER=ci\nDB_PASSWORD=ci\nAI_API_KEY=\n' > .env

      - name: Lancer MySQL + Tomcat
        run: docker compose up -d --build --wait

      - name: L'application démarre et répond
        run: curl -fsS --retry 20 --retry-delay 3 --retry-all-errors http://localhost:8080/connexion > /dev/null

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs


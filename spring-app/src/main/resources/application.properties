# Remplace persistence.xml et web.xml.
# Les variables ${...} viennent de l'environnement (docker-compose.yml) ou, à défaut, du .env à la racine
# du dépôt, lu par config.ChargementDotenv. L'environnement l'emporte toujours sur le .env.

# --- Base de données ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# Les tables sont créées par database/schema.sql : on vérifie seulement que les entités leur correspondent
spring.jpa.hibernate.ddl-auto=validate
# Noms par défaut d'Hibernate, comme dans jee-app : sans ça, Spring renomme colonnes et tables de jointure
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
# Pas de session Hibernate ouverte pendant l'affichage : les JSP ne lisent que ce qui est chargé par JOIN FETCH
spring.jpa.open-in-view=false
# Afficher les requêtes SQL dans la console pour déboguer
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Vues JSP ---
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- Envoi des pièces justificatives : 5 Mo par fichier, 25 Mo par envoi ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# --- Réglages propres à l'application (lus par @Value) ---
assurance.dossier-pieces=${DOSSIER_PIECES:}
assurance.ia.cle=${AI_API_KEY:}
assurance.ia.modele=${AI_MODEL:}
assurance.ia.modele-secours=${AI_MODEL_SECOURS:}

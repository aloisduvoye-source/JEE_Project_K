services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: assurance
      # Utilisateur de l'application (celui du .env) : créé avec tous les droits sur la base "assurance"
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # 3307 côté machine pour ne pas entrer en conflit avec un MySQL déjà installé (3306)
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Exécutés automatiquement, dans l'ordre, à la première création de la base
      # (après une modification : docker compose down -v pour repartir d'une base neuve)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/dump.sql:/docker-entrypoint-initdb.d/2-dump.sql:ro
    healthcheck:
      # 127.0.0.1 (TCP) et non localhost (socket) : pendant l'exécution de schema.sql et dump.sql,
      # MySQL tourne sur un serveur temporaire sans réseau, que seul le socket atteint.
      # Avec le socket, la base serait déclarée prête trop tôt et Tomcat ne pourrait pas s'y connecter.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  tomcat:
    build: .
    container_name: tomcat_app
    ports:
      - "8080:8080"
    depends_on:
      # Attend que MySQL soit prêt (et pas seulement démarré)
      db:
        condition: service_healthy
    environment:
      # Dans le conteneur, la base est joignable par le nom du service "db", pas par localhost
      - DB_URL=jdbc:mysql://db:3306/assurance
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - AI_API_KEY=${AI_API_KEY}
      # Facultatifs : modèles Gemini (vides = valeurs par défaut de ClientGemini)
      - AI_MODEL=${AI_MODEL:-}
      - AI_MODEL_SECOURS=${AI_MODEL_SECOURS:-}
      # Dates du métier (début de contrat, échéances) à l'heure de Paris : sans ça, le conteneur est en UTC
      # et LocalDate.now() est encore la veille entre minuit et 1 h (2 h en été)
      - TZ=Europe/Paris

volumes:
  db_data:
